# Local development: Postgres 16 with TimescaleDB. Matches appsettings.Development.json in Api and Worker.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: nms
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms
    ports:
      - "5432:5432"
    volumes:
      - nms-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nms-pg:
