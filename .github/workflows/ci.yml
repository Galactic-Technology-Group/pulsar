name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Build the x64 appliance ISO"
        type: boolean
        default: true
      api_url:
        description: "API URL baked into the ISO (defaults to the PULSAR_API_URL repository variable)"
        type: string
        default: ""

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Nms.sln
      - run: dotnet build Nms.sln -c Release --no-restore
      - run: dotnet test Nms.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  agent:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish agent (${{ matrix.rid }})
        # On a v1.2.3 tag the binary reports 1.2.3 (heartbeats, enrol, self-update); otherwise the csproj version.
        run: |
          VER=""
          [[ "$GITHUB_REF" == refs/tags/v* ]] && VER="-p:Version=${GITHUB_REF_NAME#v}"
          dotnet publish src/Nms.Agent/Nms.Agent.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} $VER
      - name: Checksum
        run: |
          cd out/${{ matrix.rid }}
          mv nms-agent nms-agent-${{ matrix.rid }}
          sha256sum nms-agent-${{ matrix.rid }} > nms-agent-${{ matrix.rid }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nms-agent-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/nms-agent-${{ matrix.rid }}*

  release:
    # Tag v1.2.3 -> GitHub release with both agent binaries + checksums + install assets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nms-agent-*
          path: dist
          merge-multiple: true
      - run: cp deploy/agent/install.sh deploy/agent/uninstall.sh deploy/agent/vlan-setup.sh deploy/agent/nms-agent.service deploy/agent/nms-agent-guard.sh deploy/agent/nms-agent-console.sh deploy/agent/nms-agent-console.service dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  iso:
    # x64 appliance ISO: on release tags and on demand. ~3 GB, kept as a workflow artifact (above the 2 GiB
    # release-asset limit) and optionally uploaded to Azure Blob storage.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_iso)
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nms-agent-linux-x64
          path: agent
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso
      - name: Build ISO
        env:
          API_URL: ${{ inputs.api_url != '' && inputs.api_url || vars.PULSAR_API_URL }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
          ISO_PASSWORD: ${{ secrets.ISO_CONSOLE_PASSWORD }}
        run: |
          [[ -n "$API_URL" ]] || { echo "Set the PULSAR_API_URL repository variable or pass api_url." >&2; exit 1; }
          chmod +x iso/build.sh
          ./iso/build.sh --api-url "$API_URL" --base-url "$BASE_URL" --agent-dir agent --out pulsar-agent-amd64.iso --password "${ISO_PASSWORD:-pulsar}"
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-agent-amd64-iso
          path: |
            pulsar-agent-amd64.iso
            pulsar-agent-amd64.iso.sha256
          retention-days: 14
          compression-level: 0
      - name: Upload to Azure Blob (optional)
        env:
          SAS: ${{ secrets.ISO_UPLOAD_SAS_URL }}
        run: |
          [[ -n "$SAS" ]] || { echo "ISO_UPLOAD_SAS_URL not set; skipping blob upload"; exit 0; }
          name="pulsar-agent-amd64-${GITHUB_REF_NAME}.iso"
          base="${SAS%%\?*}"; query="${SAS#*\?}"
          for f in pulsar-agent-amd64.iso pulsar-agent-amd64.iso.sha256; do
            dest="$base/${name}${f#pulsar-agent-amd64.iso}?$query"
            curl -fsS -X PUT -H "x-ms-blob-type: BlockBlob" --upload-file "$f" "$dest"
          done
          echo "Uploaded $name"

  images:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - { app: Nms.Api, image: pulsar-api }
          - { app: Nms.Portal, image: pulsar-portal }
          - { app: Nms.Worker, image: pulsar-worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/galactic-technology-group/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/galactic-technology-group/${{ matrix.image }}:latest
      # Swap ghcr.io for your ACR login server and `az acr login` when deploying to Container Apps.
